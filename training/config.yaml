# training/config.yaml
# All hyperparameters for fine-tuning NLLB-200 with LoRA on Kurdish Sorani → Swedish poetry.

# ── Model ────────────────────────────────────────────────────────────────────
model:
  # Distilled 1.3B — best accuracy/VRAM trade-off for GTX 3060 12 GB
  name: "facebook/nllb-200-distilled-1.3B"
  # Upgrade option (needs 4-bit QLoRA — uncomment + set use_4bit: true below):
  # name: "facebook/nllb-200-3.3B"

  src_lang: "ckb_Arab"
  tgt_lang: "swe_Latn"

  # Set to true only when using the 3.3B model
  use_4bit: false

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora:
  r: 16                  # Rank. Try 8 (faster) or 32 (more capacity).
  lora_alpha: 32         # Usually 2× rank
  lora_dropout: 0.05
  bias: "none"
  # Apply LoRA to all attention projections + FFN gates
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "fc1"
    - "fc2"

# ── Data ─────────────────────────────────────────────────────────────────────
data:
  train_file: "data/processed/train.jsonl"
  val_file:   "data/processed/val.jsonl"
  max_src_length: 256    # tokens — covers most poems
  max_tgt_length: 256

# ── Training ─────────────────────────────────────────────────────────────────
training:
  output_dir: "checkpoints"
  num_train_epochs: 10
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8   # Effective batch = 4 × 8 = 32
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Mixed precision — bf16 is native on RTX 30-series
  bf16: true
  fp16: false

  # Save memory by recomputing activations during backward pass
  gradient_checkpointing: true

  # Evaluation & checkpointing
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_chrf"
  greater_is_better: true
  save_total_limit: 3

  # Logging
  logging_steps: 20
  report_to: "none"     # Set to "wandb" or "tensorboard" if desired

  # Early stopping
  early_stopping_patience: 5

  # Seed
  seed: 42
